[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "symfonos-tools"
version = "0.1.0"
description = "symfonOS: Software-Center, Design-Center, Assistent, Konverter-GUI (syp/syp-convert sind in C, siehe csrc/)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8", "zstandard>=0.22"]

[project.scripts]
symfonos-assist = "symfonos_assist.cli:main"

[project.gui-scripts]
syp-convert-gui = "syp_convert.gui:main"
symfonos-store = "syp_store.gui:main"
symfonos-design = "symfonos_design.center:main"
symfonos-assist-gui = "symfonos_assist.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symfonos_design = ["layouts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
