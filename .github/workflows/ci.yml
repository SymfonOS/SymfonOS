name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nächtlich: Repos spiegeln + ISO bauen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 nftables shellcheck dpkg
          pip install -e ".[gui,test]" ruff
      - name: Lint
        run: |
          ruff check src tests --select E,F,W --ignore E501,E731,E741
          shellcheck -S warning exam/symfonos-exam iso/build.sh tools/repo-sync.sh system/usr/bin/* system/usr/lib/symfonos/*.sh iso/airootfs/usr/local/bin/*
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  iso:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Release-Schlüssel bereitstellen
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          pacman -Sy --noconfirm --needed python python-cryptography python-zstandard
          if [ -n "$SYP_SIGNING_KEY" ]; then
            umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > /tmp/release.key
            PYTHONPATH=src python -c "from syp.crypto import SecretKey; import pathlib; k=SecretKey.load(pathlib.Path('/tmp/release.key')); k.save(pathlib.Path('/tmp/r.key'), pathlib.Path('/tmp/release.pub'))"
            echo "SYP_RELEASE_PUB=/tmp/release.pub" >> "$GITHUB_ENV"
          fi
      - name: ISO bauen
        run: ./iso/build.sh "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: symfonos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 7

  repo:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Arch-Pakete konvertieren und signieren
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          test -n "$SYP_SIGNING_KEY" || { echo "Secret SYP_SIGNING_KEY fehlt"; exit 1; }
          pacman -Sy --noconfirm --needed python python-cryptography python-zstandard curl
          umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > /tmp/release.key
          SYP_KEY=/tmp/release.key ./tools/repo-sync.sh "$PWD/site/repo"
      - name: Auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true

  release:
    needs: iso
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: symfonos-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS
