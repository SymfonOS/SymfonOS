name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nächtlich: Repos spiegeln + ISO bauen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 nftables shellcheck dpkg \
            build-essential pkg-config libarchive-dev libzstd-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev
          pip install -e ".[gui,test]" ruff
      - name: Lint
        run: |
          ruff check src tests --select E,F,W --ignore E501,E731,E741
          shellcheck -S warning exam/symfonos-exam iso/build.sh tools/repo-sync.sh system/usr/bin/* system/usr/lib/symfonos/*.sh iso/airootfs/usr/local/bin/* \
            system/usr/lib/syp/kernel-hook distro/bootstrap/*.sh distro/installer/symfonos-install distro/security/install.sh \
            distro/security/bin/symfonos-security distro/security/bin/update-crypto-policies
          ruff check --select E,F,W --ignore E501 distro/security/bin/symfonos-secureboot
      - name: C-Werkzeuge bauen (-Werror)
        run: make -C csrc -j4 CFLAGS="-O2 -g -Werror"
      - name: Tests mit AddressSanitizer/UBSan
        env:
          QT_QPA_PLATFORM: offscreen
          SYP_SKIP_BUILD: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: |
          make -C csrc clean
          make -C csrc -j4 CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined"
          pytest -q tests/test_syp.py tests/test_convert.py
          make -C csrc clean
      - name: Root-Tests (nftables-Regelwerk mit Prüfungsmodus, Chroot-Bau)
        run: |
          make -C csrc -j4
          sudo -E env "PATH=$PATH" SYP_SKIP_BUILD=1 "$(command -v python)" -m pytest -q -rs -p no:cacheprovider \
            tests/test_security.py::test_base_firewall_coexists_with_exam_mode tests/test_exam.py \
            tests/test_syp.py::test_chroot_build tests/test_syp.py::test_buildall_root_installs_without_syp_in_path 2>&1 | tee root.log; rc=${PIPESTATUS[0]}
          echo "::notice title=Root-Tests::$(tail -4 root.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          sudo chown -R "$USER" csrc tests
          exit "$rc"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          SYMFONOS_NET_TESTS: "1"   # u. a. Microsoft-UEFI-Zertifikate für symfonos-secureboot laden und prüfen
        run: |
          pytest -q -rs 2>&1 | tee pytest.log; rc=${PIPESTATUS[0]}
          echo "::notice title=pytest::$(grep -E '^SKIPPED|passed|failed' pytest.log | tail -8 | sed ':a;N;$!ba;s/\n/%0A/g')"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=pytest::$(tail -c 3500 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit "$rc"

  iso:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Nur ein ISO-Bau gleichzeitig; ein neuer Commit ersetzt den laufenden Bau
    concurrency:
      group: iso-nightly
      cancel-in-progress: true
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium /opt/google /usr/lib/jvm /opt/pipx
          sudo docker image prune -af >/dev/null
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /
      - name: Release-Schlüssel bereitstellen
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          mkdir -p keys
          if [ -n "$SYP_SIGNING_KEY" ]; then
            sudo apt-get install -y -q build-essential pkg-config libarchive-dev libzstd-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev >/dev/null
            make -C csrc -j4 >/dev/null
            (umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > keys/release.key)
            csrc/bin/syp pubkey keys/release.key keys/release.pub
            rm -f keys/release.key   # nur der öffentliche Schlüssel kommt ins ISO
          fi
      - name: ISO bauen (archlinux-Container)
        run: |
          pub=""; [ -f keys/release.pub ] && pub="-e SYP_RELEASE_PUB=/src/keys/release.pub"
          set +e
          sudo docker run --rm --privileged $pub -v "$PWD:/src" archlinux:latest \
            bash -c 'pacman-key --init >/dev/null && pacman -Sy --noconfirm archlinux-keyring >/dev/null && /src/iso/build.sh /src/out' 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=ISO-Build (Exit $rc)::$(grep -v '^ *[0-9.]*%' build.log | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          sudo chown -R "$USER" out 2>/dev/null || true
          ls -la out 2>/dev/null || true
          exit "$rc"
      - name: Boot-Test (QEMU)
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 xorriso genisoimage
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          LOG=out/smoke-serial.log ./tools/smoke-test.sh out/symfonos-*.iso
      - name: Als Release »nightly« veröffentlichen (Teile < 2 GB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso=$(ls symfonos-*.iso)
          split -b 1900M -d -a 2 "$iso" "$iso.part"
          sha256sum "$iso" > SHA256SUMS
          sha256sum "$iso".part* >> SHA256SUMS
          cat > ANLEITUNG.txt <<EOT
          symfonOS – Live-/Installations-ISO (Nightly, Commit ${GITHUB_SHA::8})
          Zusammensetzen:  cat $iso.part* > $iso
          Prüfen:          sha256sum -c SHA256SUMS --ignore-missing
          Auf USB-Stick:   sudo dd if=$iso of=/dev/sdX bs=4M status=progress oflag=sync
          EOT
          # Erst vollständig in ein temporäres Release hochladen, dann austauschen:
          # ein abgebrochener Upload lässt das bisherige Nightly unangetastet.
          tmp="nightly-run-$GITHUB_RUN_ID"
          gh release create "$tmp" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "symfonOS Nightly $(date +%Y-%m-%d)" --notes-file ANLEITUNG.txt \
            "$iso".part* SHA256SUMS ANLEITUNG.txt smoke-serial.log
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release edit "$tmp" --repo "$GITHUB_REPOSITORY" --tag nightly --target "$GITHUB_SHA"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tmp" || true
          echo "::notice title=ISO veröffentlicht::Release nightly, Commit ${GITHUB_SHA::8}"
  repo:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Arch-Pakete konvertieren und signieren
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          test -n "$SYP_SIGNING_KEY" || { echo "Secret SYP_SIGNING_KEY fehlt"; exit 1; }
          pacman -Sy --noconfirm --needed base-devel libarchive zstd libsodium sqlite curl
          umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > /tmp/release.key
          SYP_KEY=/tmp/release.key ./tools/repo-sync.sh "$PWD/site/repo"
      - name: Auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
