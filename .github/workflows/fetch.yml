name: Referenz holen

# Lädt Dateien (z. B. Doku oder Quellen) herunter und legt sie auf dem Branch »ref« ab –
# für Arbeitsumgebungen ohne direkten Zugriff auf die Quell-Server.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs, durch Leerzeichen getrennt"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Laden
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p dl && cd dl
          for u in $URLS; do
            curl -fsSL --retry 3 -O "$u" || echo "FEHLER $u" | tee -a ../errors.txt
          done
          ls -la
      - name: Auf Branch »ref« ablegen (nicht main)
        run: |
          cd dl
          git init -q -b ref && git add -A
          git -c user.name="symfonOS CI" -c user.email=ci@users.noreply.github.com commit -qm "Referenzmaterial"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ref
