name: Bootstrap (aus Quellcode)

# Baut symfonOS komplett aus Quellcode: Cross-Werkzeugkette -> temporäre Werkzeuge -> Chroot ->
# alle Rezepte als signierte .syp-Pakete -> ISO. Ein Lauf arbeitet höchstens ~5 h; der Zustand
# wird als Release »bootstrap-state« gesichert und beim nächsten Lauf fortgesetzt.
on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Zustand verwerfen und von vorn beginnen"
        type: boolean
        default: false
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SYM: /mnt/symfonos
      STATE_TAG: bootstrap-state
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz und Host-Werkzeuge
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /opt/az
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bison gawk texinfo m4 python3 xz-utils pkg-config zstd \
            libarchive-dev libzstd-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev
          df -h /
      - name: Zustand wiederherstellen
        if: ${{ !inputs.reset }}
        run: |
          mkdir -p state && cd state
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'state.tar.zst.part*' --pattern 'keys.tar'
            cat state.tar.zst.part* | sudo tar --zstd -xpf - -C /
            tar -xf keys.tar -C "$GITHUB_WORKSPACE"
            sudo chown -R "$USER" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/keys" 2>/dev/null || true
            rm -f state.tar.zst.part*
            echo "Stufen erledigt: $(ls "$SYM/.stamps" 2>/dev/null | wc -l), Pakete: $(find out/repo -name '*.syp' 2>/dev/null | wc -l)"
          fi
      - name: Signaturschlüssel
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          make -C csrc -j4
          mkdir -p keys
          if [ -n "$SYP_SIGNING_KEY" ]; then
            umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > keys/release.key
            rm -f keys/.dev
            csrc/bin/syp pubkey keys/release.key keys/release.pub
          elif [ ! -f keys/release.key ]; then
            csrc/bin/syp keygen keys/release --comment "symfonOS Bootstrap (Entwicklungsschlüssel)"
            touch keys/.dev
            echo "::warning::Kein Secret SYP_SIGNING_KEY – Entwicklungsschlüssel erzeugt (nicht für Releases)"
          fi
      - name: Bauen (Etappe)
        id: build
        run: |
          set +e
          sudo -E env "PATH=$PATH" SYP_KEY="$PWD/keys/release.key" MAX_MINUTES=280 PKGREPO="$PWD/out/repo/symfonos" \
            bash -c 'cd distro/bootstrap && ./00-prepare.sh && ./10-cross-toolchain.sh && ./20-temp-tools.sh && ./30-chroot-tools.sh && ./40-system.sh' 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error title=Bootstrap (Exit $rc)::$(grep -v '^ *[0-9.]*%' build.log | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit 0
      - name: Zustand sichern
        if: always()
        run: |
          sudo umount -l "$SYM"/{run,sys,proc,dev/pts,dev} 2>/dev/null || true
          sudo tar --zstd -cpf - -C / "${SYM#/}" "${GITHUB_WORKSPACE#/}/out" 2>/dev/null | split -b 1900M -d -a 2 - state.tar.zst.part
          # Nur ein selbst erzeugter Entwicklungsschlüssel wird gesichert – niemals das Release-Secret
          if [ -f keys/.dev ]; then tar -cf keys.tar keys; else tar -cf keys.tar keys/release.pub; fi
          gh release delete "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Bootstrap-Zwischenstand" \
            --notes "Interner Zustand des Quellcode-Bootstraps (nicht zur Installation gedacht)." state.tar.zst.part* keys.tar
      - name: ISO erzeugen
        if: steps.build.outputs.rc == '0'
        run: |
          sudo -E env "PATH=$PATH" SYP_PUB="$PWD/keys/release.pub" PKGREPO="$PWD/out/repo/symfonos" \
            bash distro/bootstrap/50-image.sh "$PWD/out/symfonos-base-$(date +%Y.%m.%d)-x86_64.iso"
          sudo chown -R "$USER" out
      - name: Boot-Test
        if: steps.build.outputs.rc == '0'
        continue-on-error: true
        run: |
          sudo apt-get install -y -q qemu-system-x86 xorriso genisoimage
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          LOG=out/smoke-serial.log tools/smoke-test.sh out/symfonos-base-*.iso
      - name: ISO veröffentlichen
        if: steps.build.outputs.rc == '0'
        run: |
          cd out
          iso=$(ls symfonos-base-*.iso)
          split -b 1900M -d -a 2 "$iso" "$iso.part"
          gh release delete source-nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create source-nightly --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "symfonOS Basissystem aus Quellcode $(date +%Y-%m-%d)" \
            --notes "Zusammensetzen: cat $iso.part* > $iso" "$iso".part* "$iso.sha256"
