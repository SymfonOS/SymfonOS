name: Bootstrap (aus Quellcode)

# Baut symfonOS komplett aus Quellcode: Cross-Werkzeugkette -> temporäre Werkzeuge -> Chroot ->
# alle Rezepte als signierte .syp-Pakete -> ISO. Ein Lauf arbeitet höchstens ~5 h; der Zustand
# wird als Release »bootstrap-state« gesichert und beim nächsten Lauf fortgesetzt.
on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Zustand verwerfen und von vorn beginnen"
        type: boolean
        default: false
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SYM: /mnt/symfonos
      STATE_TAG: bootstrap-state
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz und Host-Werkzeuge
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /opt/az
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bison gawk texinfo m4 python3 xz-utils pkg-config zstd \
            libarchive-dev libzstd-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev
          df -h /
      - name: Zustand wiederherstellen
        id: restore
        if: ${{ !inputs.reset }}
        run: |
          mkdir -p state && cd state
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'state.tar.zst.part*'
            cat state.tar.zst.part* | sudo tar --zstd -xpf - -C /
            # nur der öffentliche Schlüssel (optional; fehlt nach einem Schlüsselwechsel)
            if gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'keys.tar' 2>/dev/null; then
              tar -xf keys.tar -C "$GITHUB_WORKSPACE" keys/release.pub 2>/dev/null || true
            fi
            sudo chown -R "$USER" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/keys" 2>/dev/null || true
            rm -f state.tar.zst.part*
            echo "Stufen erledigt: $(ls "$SYM/.stamps" 2>/dev/null | wc -l), Pakete: $(find out/repo -name '*.syp' 2>/dev/null | wc -l)"
          fi
      - name: Signaturschlüssel
        env:
          SYP_SIGNING_KEY: ${{ secrets.SYP_SIGNING_KEY }}
        run: |
          make -C csrc -j4
          # Öffentliches Repository: Ohne Secret gibt es keinen sicheren Ort für den privaten Schlüssel.
          # Niemals einen Schlüssel erzeugen und mit dem Zwischenstand veröffentlichen.
          if [ -z "$SYP_SIGNING_KEY" ]; then
            echo "::error title=Signaturschlüssel fehlt::Secret SYP_SIGNING_KEY anlegen (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          mkdir -p keys
          old_pub=$(cat keys/release.pub 2>/dev/null || true)
          rm -f keys/release.key keys/.dev
          (umask 077; printf '%s\n' "$SYP_SIGNING_KEY" > keys/release.key)
          csrc/bin/syp pubkey keys/release.key keys/release.pub
          if [ -n "$old_pub" ] && [ "$old_pub" != "$(cat keys/release.pub)" ]; then
            # Schlüsselwechsel: mit dem alten Schlüssel signierte Pakete verwerfen und neu bauen
            # (Toolchain und Chroot bleiben); die Bauumgebung vertraut danach nur dem neuen Schlüssel.
            echo "::warning title=Schlüsselwechsel::Pakete des alten Schlüssels werden verworfen und neu gebaut"
            sudo rm -rf out/repo "$SYM/etc/syp/keys" "$SYM/var/lib/syp/repos"
          fi
      - name: Bauen (Etappe)
        id: build
        run: |
          set +e
          # Harte Obergrenze, damit danach genug Zeit zum Sichern bleibt (Job-Timeout 350 min).
          # buildall hört mit MAX_MINUTES von selbst sauber auf; ein Abbruch in Stufe 1–3 ist unkritisch,
          # weil jeder Schritt erst nach Erfolg als erledigt gilt und beim nächsten Lauf neu beginnt.
          sudo -E timeout -k 2m 270m env "PATH=$PATH" SYP_KEY="$PWD/keys/release.key" MAX_MINUTES=250 KEEP_GOING=1 PKGREPO="$PWD/out/repo/symfonos" \
            bash -c 'cd distro/bootstrap && ./00-prepare.sh && ./10-cross-toolchain.sh && ./20-temp-tools.sh && ./30-chroot-tools.sh && ./40-system.sh' 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then rc=3; echo "::notice title=Bootstrap::Zeitbudget erreicht, nächster Lauf setzt fort"; fi
          echo "::notice title=Stand::Stufen: $(sudo ls "$SYM/.stamps" 2>/dev/null | tr '\n' ' ') · Pakete: $(find out/repo -name '*.syp' 2>/dev/null | wc -l)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error title=Bootstrap (Exit $rc)::$(grep -v '^ *[0-9.]*%' build.log | tail -c 3500 | enc)"
          fi
          # Übersicht aller direkt fehlgeschlagenen Rezepte (eine Annotation), dann Details je Rezept:
          # die eigentlichen Fehlerzeilen seines Bauabschnitts statt nur des Endes (GitHub zeigt max. 10 Fehler)
          failed=$(sed -n 's/^ *✗ \([^:]*\):.*/\1/p' build.log | sort -u)
          [ -n "$failed" ] && echo "::notice title=Fehlgeschlagene Rezepte ($(echo "$failed" | wc -l))::$(sed -n 's/^ *✗ //p' build.log | sort -u | enc)"
          for name in $(echo "$failed" | head -9); do
            sect=$(awk -v n="$name" '/^==> \[[0-9]+\/[0-9]+\] /{on=($3==n)} on' build.log | grep -v '^ *[0-9.]*%')
            # echte Fehler zuerst, Folgemeldungen danach; Wiederholungen nur einmal
            errs=$( { echo "$sect" | grep -E 'error:|ERROR|Error [0-9]|undefined reference|cannot find|No rule|fehlgeschlagen|Fehler|fehlt|missing'
                      echo "$sect" | grep -E 'No such file|not found' | grep -v '^chmod'; } | awk '!seen[$0]++' | head -14)
            echo "::error title=Rezept $name::$( { echo "$errs"; echo '…'; echo "$sect" | tail -n 6; } | tail -c 2800 | enc)"
          done
          grep -E '^:: gebaut' build.log | tail -1 | sed 's/^/::notice title=buildall::/' || true
          exit 0
      - name: Zustand sichern
        # Nur sichern, wenn der alte Stand geladen wurde und tatsächlich gebaut wurde – sonst würde
        # ein leerer Zustand den guten Zwischenstand (Stunden Rechenzeit) ersetzen
        if: always() && steps.restore.outcome != 'failure' && steps.build.outcome == 'success'
        run: |
          if [ ! -d "$SYM/.stamps" ] || [ -z "$(sudo ls "$SYM/.stamps")" ]; then
            echo "::error::Kein Bauzustand vorhanden – Zwischenstand wird nicht überschrieben"; exit 1
          fi
          sudo umount -l "$SYM"/{run,sys,proc,dev/pts,dev} 2>/dev/null || true
          sudo tar --zstd -cpf - -C / "${SYM#/}" "${GITHUB_WORKSPACE#/}/out" 2>/dev/null | split -b 1900M -d -a 2 - state.tar.zst.part
          # Nur der öffentliche Schlüssel kommt in den (öffentlichen) Zwischenstand
          tar -cf keys.tar keys/release.pub   # schlägt fehl, falls der Schlüsselschritt nicht lief
          # Erst vollständig hochladen, dann den alten Stand ersetzen: ein fehlgeschlagener Upload
          # darf den letzten guten Zwischenstand (Stunden Rechenzeit) nicht löschen.
          tmp="$STATE_TAG-run-$GITHUB_RUN_ID"
          gh release create "$tmp" --repo "$GITHUB_REPOSITORY" --prerelease --title "Bootstrap-Zwischenstand" \
            --notes "Interner Zustand des Quellcode-Bootstraps (nicht zur Installation gedacht)." state.tar.zst.part* keys.tar
          gh release delete "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release edit "$tmp" --repo "$GITHUB_REPOSITORY" --tag "$STATE_TAG"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tmp" || true
      - name: ISO erzeugen
        if: steps.build.outputs.rc == '0'
        run: |
          set +e
          sudo -E env "PATH=$PATH" SYP_PUB="$PWD/keys/release.pub" PKGREPO="$PWD/out/repo/symfonos" \
            bash distro/bootstrap/50-image.sh "$PWD/out/symfonos-base-$(date +%Y.%m.%d)-x86_64.iso" 2>&1 | tee image.log
          rc=${PIPESTATUS[0]}
          sudo chown -R "$USER" out
          if [ "$rc" -ne 0 ]; then
            echo "::error title=ISO-Erzeugung (Exit $rc)::$(grep -v '^ *[0-9.]*%' image.log | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit "$rc"
          fi
      - name: Boot-Test
        if: steps.build.outputs.rc == '0'
        continue-on-error: true
        run: |
          sudo apt-get install -y -q qemu-system-x86 xorriso genisoimage
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          LOG=out/smoke-serial.log tools/smoke-test.sh out/symfonos-base-*.iso
      - name: ISO veröffentlichen
        if: steps.build.outputs.rc == '0'
        run: |
          cd out
          iso=$(ls symfonos-base-*.iso)
          split -b 1900M -d -a 2 "$iso" "$iso.part"
          tmp="source-nightly-run-$GITHUB_RUN_ID"
          gh release create "$tmp" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "symfonOS Basissystem aus Quellcode $(date +%Y-%m-%d)" \
            --notes "Zusammensetzen: cat $iso.part* > $iso" "$iso".part* "$iso.sha256" $(ls smoke-serial.log 2>/dev/null)
          gh release delete source-nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release edit "$tmp" --repo "$GITHUB_REPOSITORY" --tag source-nightly
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tmp" || true
      - name: Ergebnis
        if: always()
        run: |
          case "${{ steps.build.outputs.rc }}" in
            0) echo "Bootstrap vollständig" ;;
            3) echo "Zeitbudget erreicht – der nächste Lauf setzt fort" ;;
            *) echo "::error::Bootstrap fehlgeschlagen (Exit ${{ steps.build.outputs.rc }}), Zwischenstand gesichert"; exit 1 ;;
          esac
