name: Rezepte

on:
  push:
    branches: [main]
    paths: ["distro/recipes/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syp bauen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config libarchive-dev libzstd-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev
          make -C csrc -j4
      - name: Fehlende Prüfsummen ermitteln (Quellen laden, sha256 eintragen)
        run: |
          set +e
          failed=() errs=""
          for r in distro/recipes/*/SYPBUILD.toml; do
            grep -q 'sha256 = "TODO"' "$r" || continue
            name=$(basename "$(dirname "$r")")
            out=$(csrc/bin/syp sums "$r" 2>&1); rc=$?
            if ((rc)); then
              failed+=("$name")
              why=$(echo "$out" | grep -E '!!|Fehler' | tail -1)
              ((rc > 128)) && why="abgebrochen durch Signal $((rc - 128)) nach: $(echo "$out" | tail -1)"
              errs+="$name (rc=$rc): ${why:-$(echo "$out" | tail -1)}%0A"   # eine Annotation (GitHub begrenzt die Anzahl)
            fi
          done
          if ((${#failed[@]})); then
            echo "::warning title=Quellen nicht ladbar (${#failed[@]})::${errs:0:3800}"
          fi
          echo "Rezepte ohne Prüfsumme: $(grep -l 'sha256 = "TODO"' distro/recipes/*/SYPBUILD.toml | wc -l)"
      - name: Änderungen committen
        run: |
          if git diff --quiet; then echo "Keine neuen Prüfsummen"; exit 0; fi
          git config user.name "symfonOS CI"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "Rezepte: sha256 der Quellen eingetragen [skip ci]"
          # main kann sich während des Laufs bewegt haben: neu aufsetzen statt Prüfsummen zu verlieren
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Abhängigkeitsgraph prüfen
        run: csrc/bin/syp buildall distro/recipes --repo /tmp/dry -n | tail -3
