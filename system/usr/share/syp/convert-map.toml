# Abhängigkeits-Mapping für syp-convert.
# Eigene Ergänzungen: /etc/syp/convert-map.toml (gleiches Format, überschreibt Einträge).
# Regeln sind POSIX Extended Regular Expressions (keine Lazy-Quantoren).
# Leerer Zielwert ("") = Abhängigkeit ignorieren.

[ignore]
deb = ["debconf", "debconf-2.0", "cdebconf", "dpkg", "init-system-helpers", "lsb-base",
       "sysvinit-utils", "${*}", "ucf", "install-info", "*-dev", "dh-*", "adduser",
       "ubuntu-advantage-tools", "apt", "apt-utils", "base-files", "libpam-systemd"]
rpm = ["rpmlib(*)", "config(*)", "rtld(*)", "/sbin/ldconfig", "/usr/sbin/ldconfig",
       "*-devel", "pkgconfig(*)", "systemd-units", "chkconfig", "/sbin/chkconfig",
       "fedora-release*", "redhat-release*", "system-release*", "dnf*", "rpm", "rpm-libs",
       "glibc-langpack-*", "glibc-minimal-langpack", "/sbin/install-info", "info", "crypto-policies"]
arch = []

[files]
"/bin/sh" = "sh"
"/usr/bin/sh" = "sh"
