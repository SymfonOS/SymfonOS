[arch]

# Regeln: [Regex, Ersetzung]; "!ignore" = verwerfen. Werden nach der Tabelle geprüft.
[rules]
deb = [
  ["^python3-(.+)$", "python-\\1"],
  ["^lib(.+)-perl$", "perl-\\1"],
  ["^fonts-(.+)$", "ttf-\\1"],
  ["^gir1\\.2-.*$", "!ignore"],
  ["^(.+)-common$", "\\1"],
  ["^(.+)-data$", "\\1"],
  ["^(lib[a-z0-9+.-]*[a-z+])-?[0-9][0-9.]*(t64)?a?$", "\\1"],
  ["^lib([a-z0-9+.-]*[a-z+])-?[0-9][0-9.]*(t64)?$", "\\1"],
]
rpm = [
  ["^python3dist\\((.+)\\)$", "python-\\1"],
  ["^python3-(.+)$", "python-\\1"],
  ["^perl\\((.+)\\)$", "perl-\\1"],
  ["^(lib.+\\.so\\.[0-9.]+)\\(.*$", "so:\\1"],
  ["^(.+)\\((x86-64|aarch-64)\\)$", "\\1"],
  ["^(.+)-libs$", "\\1"],
  ["^font\\(.*\\)$", "!ignore"],
  ["^lib(.+)$", "\\1"],
]
arch = []
