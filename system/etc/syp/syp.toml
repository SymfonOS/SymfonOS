# symfonOS – syp-Konfiguration
arch = "x86_64"

# Signierte Repositories. Kleinere priority = bevorzugt.
# Das ganze System ist aus Quellcode gebaut; die CI veröffentlicht die Pakete nach bestandenen ISO-Tests als
# GitHub-Release: erst testing, nach 7 Tagen stable (tools/promote-release.sh). Release-Dateien haben keine Unterordner: flat = true.
[[repo]]
name = "symfonos"
url = "https://github.com/SymfonOS/SymfonOS/releases/download/repo-x86_64"
flat = true
priority = 10

# Testkanal: jeder Bau, der alle ISO-Tests bestanden hat, noch vor der 7-tägigen Wartezeit für »symfonos«
# (docs/QUALITAET.md). Für Tester: einkommentieren, dann »sudo syp sync && sudo syp upgrade«.
#[[repo]]
#name = "testing"
#url = "https://github.com/SymfonOS/SymfonOS/releases/download/repo-x86_64-testing"
#flat = true
#priority = 5

[snapshots]
enabled = true
backend = "btrfs"          # syp legt vor jedem Update /.snapshots/syp-…-pre an (die letzten 10); »syp rollback --system«

[cache]
keep = 3                   # Versionen je Paket für `syp rollback`

[security]
require_signatures = true
run_scripts = true          # Skripte konvertierter Fremdpakete laufen trotzdem nur mit --trust-scripts
