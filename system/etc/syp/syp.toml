# symfonOS – syp-Konfiguration
arch = "x86_64"

# Signierte Repositories. Kleinere priority = bevorzugt.
# Das ganze System ist aus Quellcode gebaut; die CI veröffentlicht die Pakete nach bestandenen ISO-Tests als
# GitHub-Release (tools/publish-repo.sh). Release-Dateien haben keine Unterordner: flat = true.
[[repo]]
name = "symfonos"
url = "https://github.com/SymfonOS/SymfonOS/releases/download/repo-x86_64"
flat = true
priority = 10

# Aus Arch konvertierte Pakete (nur für die alte Arch-basierte Ausgabe): aus. Sie würden Kernel, systemd und
# glibc durch Arch-Builds ohne SELinux und ohne die symfonOS-Härtung ersetzen.
[[repo]]
name = "core"
url = "https://thomasrohm23-bit.github.io/symfonOS/repo/core/x86_64"
priority = 20
enabled = false

[[repo]]
name = "extra"
url = "https://thomasrohm23-bit.github.io/symfonOS/repo/extra/x86_64"
priority = 30
enabled = false

[snapshots]
enabled = true
backend = "snapper"

[cache]
keep = 3                   # Versionen je Paket für `syp rollback`

[security]
require_signatures = true
run_scripts = true          # Skripte konvertierter Fremdpakete laufen trotzdem nur mit --trust-scripts
