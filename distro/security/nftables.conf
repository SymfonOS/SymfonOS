#!/usr/bin/nft -f
# symfonOS-Firewall: eingehend alles gesperrt außer Antworten, Loopback und nötigem ICMP.
# Eigene Freigaben: sudo symfonos-security firewall allow 22/tcp   (landen in /etc/nftables.d/)
# Nur die eigene Tabelle ersetzen, nie "flush ruleset": sonst würde ein Reload fremde Tabellen
# löschen, etwa die Allowlist des Prüfungsmodus (inet symfonos_exam) oder Regeln von libvirt/podman.
table inet symfonos
delete table inet symfonos

table inet symfonos {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iifname "lo" accept
    meta l4proto icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
      nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept
    meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    icmp type echo-request limit rate 5/second accept
    icmpv6 type echo-request limit rate 5/second accept
    udp sport 547 udp dport 546 accept comment "DHCPv6-Client"
    include "/etc/nftables.d/*.nft"
    limit rate 10/minute log prefix "symfonos-fw drop: " level info
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
