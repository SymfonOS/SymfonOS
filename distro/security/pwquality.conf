# symfonOS-Passwortregeln (strenger als die Vorgaben von pwquality)
# Länge und Wörterbuchprüfung statt Zeichenklassen-Zwang (NIST SP 800-63B): lange Passphrasen
# aus mehreren Wörtern sind erlaubt und erwünscht
minlen = 12
minclass = 1
maxrepeat = 3
maxclassrepeat = 0
dictcheck = 1
usercheck = 1
usersubstr = 4
enforcing = 1
enforce_for_root
retry = 3
