# symfonOS – gehärtete Vorgaben für den SSH-Server (sshd ist standardmäßig nicht aktiviert)
PermitRootLogin no
MaxAuthTries 4
LoginGraceTime 30
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no
ClientAliveInterval 300
ClientAliveCountMax 2
UsePAM yes
Include /etc/crypto-policies/back-ends/openssh-server.config
