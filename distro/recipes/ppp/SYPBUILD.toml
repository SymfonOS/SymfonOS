[package]
name = "ppp"
version = "2.5.2-1"
summary = "Point-to-Point-Protokoll (pppd; DSL, Modems)"
license = "BSD-3-Clause AND GPL-2.0-or-later"
url = "https://download.samba.org/pub/ppp/"
depends = ["openssl", "libpcap", "linux-pam", "systemd"]

[[source]]
url = "https://download.samba.org/pub/ppp/ppp-2.5.2.tar.gz"
sha256 = "47da358de54a10cb10bf6ff2cf9b1c03c0d3555518f6182e8f701b8e55733cb2"

[build]
style = "autotools"
configure_flags = "--with-runtime-dir=/run/ppp --with-logfile-dir=/var/log/ppp --with-system-ca-path=/etc/ssl/certs --enable-systemd --enable-multilink --enable-cbcp"
