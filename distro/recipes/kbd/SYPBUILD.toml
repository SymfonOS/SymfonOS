# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "kbd"
version = "2.8.0-1"
summary = "Tastatur- und Konsolenwerkzeuge"
license = "GPL-2.0-or-later"
url = "https://www.kernel.org/pub/linux/utils/kbd/"
depends = ["glibc"]
makedepends = ["autoconf"]
[[source]]
url = "https://www.kernel.org/pub/linux/utils/kbd/kbd-2.8.0.tar.xz"
sha256 = "01f5806da7d1d34f594b7b2a6ae1ab23215344cf1064e8edcd3a90fef9776a11"
[build]
style = "autotools"
configure_flags = "--disable-vlock"
pre_configure = '''
sed -i '/RESIZECONS_PROGS=/s/yes/no/' configure
sed -i 's/resizecons.8 //' docs/man/man8/Makefile.in
'''
