# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "selinux-refpolicy"
version = "2.20250213-2"
summary = "SELinux Reference Policy (MCS, systemd)"
license = "GPL-2.0-only"
url = "https://github.com/SELinuxProject/refpolicy/releases/download/RELEASE_2_20250213/"
depends = ["policycoreutils"]
makedepends = ["checkpolicy", "secilc", "python", "m4", "policycoreutils", "libsemanage", "semodule-utils"]
backup = ["etc/selinux/config"]

[[source]]
url = "https://github.com/SELinuxProject/refpolicy/releases/download/RELEASE_2_20250213/refpolicy-2.20250213.tar.bz2"
sha256 = "d2487c49420e8710e999b18bbe699fbff033fe5adc5127e3f0c7dafaa9b4d209"

[build]
dir = "refpolicy"
build = '''
cd "$S"
sed -i -e 's/^#\?TYPE = .*/TYPE = mcs/' -e 's/^#\?NAME = .*/NAME = refpolicy/' -e 's/^#\?MONOLITHIC = .*/MONOLITHIC = n/' \
  -e 's/^#\?UBAC = .*/UBAC = y/' -e 's/^#\?SYSTEMD = .*/SYSTEMD = y/' -e 's/^#\?DIRECT_INITRC = .*/DIRECT_INITRC = n/' build.conf
make conf
T="SEMOD_PKG=$(command -v semodule_package) SEMOD_LNK=$(command -v semodule_link) SEMOD_EXP=$(command -v semodule_expand) CHECKMODULE=$(command -v checkmodule) CHECKPOLICY=$(command -v checkpolicy)"
for t in semodule_package semodule_link semodule_expand checkmodule checkpolicy; do command -v "$t" >/dev/null || { echo "SELinux-Werkzeug fehlt: $t" >&2; exit 1; }; done
make $T
'''
package = '''
cd "$S"
T="SEMOD_PKG=$(command -v semodule_package) SEMOD_LNK=$(command -v semodule_link) SEMOD_EXP=$(command -v semodule_expand) CHECKMODULE=$(command -v checkmodule) CHECKPOLICY=$(command -v checkpolicy)"
make $T DESTDIR="$DESTDIR" install
make $T DESTDIR="$DESTDIR" install-headers
install -Dm644 /dev/stdin "$DESTDIR/etc/selinux/config" <<'EOF'
# SELinux-Modus: enforcing | permissive | disabled
# symfonOS startet mit "permissive" und protokolliert Verstöße (ausearch -m avc);
# Umschalten: sudo symfonos-security selinux enforcing
SELINUX=permissive
SELINUXTYPE=refpolicy
EOF
'''

[options]
strip = false

[scripts]
# Module in den Policy-Store übernehmen (erzeugt policy.NN und file_contexts) und Anmeldungen wie bei
# Fedora unconfined_u zuordnen. Ohne diesen Schritt läuft SELinux ohne Richtlinie (login stürzte ab).
post_install = '''
mkdir -p /var/lib/selinux
semodule -s refpolicy -n -i /usr/share/selinux/refpolicy/*.pp
st=/var/lib/selinux/refpolicy/active
if [ ! -e "$st/seusers.local" ]; then
  printf '__default__:unconfined_u:s0-s0:c0.c1023\nroot:unconfined_u:s0-s0:c0.c1023\n' > "$st/seusers.local"
fi
semodule -s refpolicy -n -B
if selinuxenabled 2>/dev/null; then load_policy || true; fi
'''
post_upgrade = '''
mkdir -p /var/lib/selinux
semodule -s refpolicy -n -i /usr/share/selinux/refpolicy/*.pp
semodule -s refpolicy -n -B
if selinuxenabled 2>/dev/null; then load_policy || true; fi
'''
