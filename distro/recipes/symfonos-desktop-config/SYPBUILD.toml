# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
# GENERATED von tools/desktop-recipes.py – Änderungen dort vornehmen
[package]
name = "symfonos-desktop-config"
version = "1.0-8"
arch = "any"
summary = "symfonOS-Desktop: Farbschemata, globales Design, SDDM (Wayland), PAM, Voreinstellungen"
license = "GPL-3.0-or-later"
depends = ["plasma-workspace", "sddm", "inter-font", "jetbrains-mono-font", "breeze-icons"]
backup = ["etc/xdg/kdeglobals", "etc/xdg/kwinrc", "etc/pam.d/kde", "etc/nftables.d/50-mdns.nft"]

[[source]]
path = "@/desktop"

[build]
build = ":"
package = '''
cd "$SRCDIR/desktop"
install -d "$DESTDIR/usr/share/color-schemes" "$DESTDIR/usr/share/plasma/look-and-feel" "$DESTDIR/etc/xdg/plasma-workspace/env"
cp color-schemes/*.colors "$DESTDIR/usr/share/color-schemes/"
cp -r look-and-feel/. "$DESTDIR/usr/share/plasma/look-and-feel/"
install -m644 xdg/kdeglobals xdg/kwinrc "$DESTDIR/etc/xdg/"
install -m644 xdg/plasma-workspace-env-symfonos.sh "$DESTDIR/etc/xdg/plasma-workspace/env/"
install -Dm644 branding/symfonos.svg "$DESTDIR/usr/share/icons/hicolor/scalable/apps/symfonos.svg"
install -Dm644 sddm/10-symfonos.conf "$DESTDIR/usr/lib/sddm/sddm.conf.d/10-symfonos.conf"
for f in pam.d/*; do install -Dm644 "$f" "$DESTDIR/etc/$f"; done
install -Dm644 /dev/stdin "$DESTDIR/usr/lib/systemd/system-preset/40-symfonos-desktop.preset" <<'PRE'
enable sddm.service
enable accounts-daemon.service
enable upower.service
enable bluetooth.service
# Drucken: CUPS startet bei Bedarf über den Socket, Avahi findet Netzwerkdrucker
enable cups.socket
enable cups.path
enable avahi-daemon.service
enable avahi-daemon.socket
# Desktop-Netz über NetworkManager (WLAN über iwd); systemd-networkd darf dieselben Schnittstellen nicht verwalten
enable NetworkManager.service
disable systemd-networkd.service
disable systemd-networkd.socket
disable systemd-networkd-varlink.socket
disable systemd-networkd-wait-online.service
PRE
install -d "$DESTDIR/etc/systemd/system"
ln -s /usr/lib/systemd/system/graphical.target "$DESTDIR/etc/systemd/system/default.target"
# Firewall: mDNS/DNS-SD aus dem lokalen Netz (Avahi findet Drucker und Dienste; wie Fedoras Workstation-Zone)
install -Dm644 /dev/stdin "$DESTDIR/etc/nftables.d/50-mdns.nft" <<'NFT'
ip daddr 224.0.0.251 udp dport 5353 accept comment "mDNS (Avahi)"
ip6 daddr ff02::fb udp dport 5353 accept comment "mDNS (Avahi)"
NFT
'''
