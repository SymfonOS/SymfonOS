[package]
name = "qt6-webchannel"
version = "6.9.2-1"
summary = "Qt 6 WebChannel"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base", "qt6-declarative", "qt6-websockets"]
makedepends = ["cmake", "ninja", "pkgconf"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qtwebchannel-everywhere-src-6.9.2.tar.xz"
sha256 = "878a6337ad4d2c2a1de5bedb28c36b05b2733242d10f6c3d0eae55c5433c8e65"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do [ -z "$l" ] || ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
