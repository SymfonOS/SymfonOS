# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "libselinux"
version = "3.8.1-1"
summary = "SELinux-Bibliothek"
license = "LicenseRef-Public-Domain"
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/"
depends = ["glibc", "libsepol", "pcre2"]
provides = ["so:libselinux.so.1"]

[[source]]
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/libselinux-3.8.1.tar.gz"
sha256 = "ec2d2789f931152d21c1db1eb4bc202ce4eccede34d9be9e360e3b45243cee2c"

[build]
build = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib USE_PCRE2=y
'''
package = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib USE_PCRE2=y DESTDIR="$DESTDIR" install
rm -f "$DESTDIR/usr/lib/libselinux.a"
'''
