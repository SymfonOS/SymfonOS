[package]
name = "qt6-declarative"
version = "6.9.2-1"
summary = "Qt 6 QML und Qt Quick"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base", "qt6-svg"]
makedepends = ["cmake", "ninja", "pkgconf", "qt6-shadertools", "python"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qtdeclarative-everywhere-src-6.9.2.tar.xz"
sha256 = "477f2d2c0bd98916107818725e6d498206e033dfb2859c52121e01a06ac42664"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
