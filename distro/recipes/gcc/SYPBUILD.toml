# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "gcc"
version = "15.2.0-1"
summary = "GNU Compiler Collection (C, C++)"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
url = "https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/"
depends = ["glibc", "binutils", "gmp", "mpfr", "mpc", "zlib", "zstd"]
makedepends = ["libxcrypt", "shadow"]
provides = ["cc", "c++", "gcc-libs", "so:libstdc++.so.6", "so:libgcc_s.so.1", "so:libgomp.so.1", "so:libatomic.so.1"]

[[source]]
url = "https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz"
sha256 = "TODO"

[build]
prepare = '''
cd "$S"
sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
'''
build = '''
cd "$S"; mkdir -p build; cd build
../configure --prefix=/usr LD=ld --enable-languages=c,c++ --enable-default-pie --enable-default-ssp \
  --enable-host-pie --disable-multilib --disable-bootstrap --disable-fixincludes --with-system-zlib
make
'''
package = '''
cd "$S/build"
make DESTDIR="$DESTDIR" install
ln -sf gcc "$DESTDIR/usr/bin/cc"
install -d "$DESTDIR/usr/lib/bfd-plugins"
ln -sf ../../libexec/gcc/$(./gcc/xgcc -dumpmachine)/15.2.0/liblto_plugin.so "$DESTDIR/usr/lib/bfd-plugins/"
install -d "$DESTDIR/usr/share/gdb/auto-load/usr/lib"
mv "$DESTDIR"/usr/lib/*gdb.py "$DESTDIR/usr/share/gdb/auto-load/usr/lib" 2>/dev/null || true
'''
