# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "nano"
version = "8.6-1"
summary = "Einfacher Texteditor"
license = "GPL-3.0-or-later"
url = "https://www.nano-editor.org/dist/v8/"
depends = ["glibc", "ncurses", "file"]
backup = ["etc/nanorc"]
[[source]]
url = "https://www.nano-editor.org/dist/v8/nano-8.6.tar.xz"
sha256 = "f7abfbf0eed5f573ab51bd77a458f32d82f9859c55e9689f819d96fe1437a619"
[build]
style = "autotools"
configure_flags = "--sysconfdir=/etc --enable-utf8 --docdir=/usr/share/doc/nano-8.6"
post_install = '''
install -Dm644 doc/sample.nanorc "$DESTDIR/etc/nanorc"
sed -i 's|^# include "/usr/share/nano/\*.nanorc"|include "/usr/share/nano/*.nanorc"|' "$DESTDIR/etc/nanorc"
'''
