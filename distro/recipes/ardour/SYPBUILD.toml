[package]
name = "ardour"
version = "9.8-2"
summary = "Digitale Audio-Workstation (Ardour)"
license = "GPL-2.0-or-later"
url = "https://github.com/SymfonOS/SymfonOS/releases/download/quellen/"
depends = ["glibmm2.4", "libsigc++2", "cairomm1.0", "cairo", "pango", "glib2", "libsndfile", "libsamplerate", "libarchive", "curl", "liblo", "taglib", "vamp-plugin-sdk", "rubberband", "aubio", "fftw", "lilv", "lv2", "serd", "sord", "sratom", "libxml2", "flac", "libogg", "fontconfig", "freetype", "harfbuzz", "alsa-lib", "pulseaudio", "libusb", "libx11", "libxext", "libxrandr", "boost", "readline", "hicolor-icon-theme"]
makedepends = ["python", "pkgconf", "gettext", "perl"]

[[source]]
url = "https://github.com/SymfonOS/SymfonOS/releases/download/quellen/Ardour-9.8.0.tar.bz2"
sha256 = "3e64d515c3240781eb938d97f0d0c0820c9e21374aa15dbcd4966bbccd6f73a1"

[build]
dir = "Ardour-9.8.0"
build = '''
cd "$S"
python3 waf configure --prefix=/usr --configdir=/etc --freedesktop --no-phone-home --no-lrdf --cxx17 \
  --with-backends=alsa,pulseaudio,dummy
python3 waf build -j"$(nproc)"
python3 waf i18n_mo
'''
package = '''
cd "$S"
python3 waf install --destdir="$DESTDIR"
'''
