[package]
name = "qca"
version = "2.3.10-1"
summary = "Qt-Kryptographie (QCA)"
license = "LGPL-2.1-or-later"
url = "https://download.kde.org/stable/qca/2.3.10/"
depends = ["qt6-base", "qt6-5compat", "openssl", "libgcrypt", "ca-certificates"]
makedepends = ["cmake", "ninja"]

[[source]]
url = "https://download.kde.org/stable/qca/2.3.10/qca-2.3.10.tar.xz"
sha256 = "1c5b722da93d559365719226bb121c726ec3c0dc4c67dea34f1e50e4e0d14a02"

[build]
style = "cmake"
configure_flags = "-DQT6=ON -DBUILD_WITH_QT6=ON -DQCA_INSTALL_IN_QT_PREFIX=ON -DQCA_MAN_INSTALL_DIR:PATH=/usr/share/man -DBUILD_TESTS=OFF -DQCA_FEATURE_INSTALL_DIR=/usr/lib/qt6/mkspecs/features"
pre_configure = "sed -i 's@cert.pem@certs/ca-bundle.crt@' CMakeLists.txt"
