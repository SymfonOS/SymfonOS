[package]
name = "jetbrains-mono-font"
version = "2.304-1"
arch = "any"
summary = "Schrift JetBrains Mono (Terminal, Code)"
license = "OFL-1.1"
url = "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/"
depends = ["fontconfig"]

[[source]]
url = "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
sha256 = "TODO"

[build]
build = ":"
package = '''
cd "$SRCDIR"
find . -type f \( -name '*.ttf' -o -name '*.ttc' -o -name '*.otf' \) -path '*/fonts/ttf/*' -print0 |
  while IFS= read -r -d '' f; do install -Dm644 "$f" "$DESTDIR/usr/share/fonts/jetbrains-mono/$(basename "$f")"; done
'''
