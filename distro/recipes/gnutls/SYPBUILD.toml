[package]
name = "gnutls"
version = "3.8.10-1"
summary = "TLS-Bibliothek (GnuTLS)"
license = "LGPL-2.1-or-later"
url = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/"
depends = ["nettle", "libtasn1", "libunistring", "gmp", "zlib", "zstd", "brotli"]

[[source]]
url = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.10.tar.xz"
sha256 = "db7fab7cce791e7727ebbef2334301c821d79a550ec55c9ef096b610b03eb6b7"

[build]
style = "autotools"
configure_flags = "--with-default-trust-store-file=/etc/ssl/certs/ca-certificates.crt --with-included-unistring=no --without-p11-kit --disable-guile --disable-doc"
