# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "iproute2"
version = "6.16.0-1"
summary = "Netzwerkkonfiguration (ip, ss)"
license = "GPL-2.0-or-later"
url = "https://www.kernel.org/pub/linux/utils/net/iproute2/"
depends = ["glibc", "libcap", "libelf"]
[[source]]
url = "https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-6.16.0.tar.xz"
sha256 = "5900ccc15f9ac3bf7b7eae81deb5937123df35e99347a7f11a22818482f0a8d0"
[build]
prepare = '''
cd "$S"
sed -i /ARPD/d Makefile
rm -f man/man8/arpd.8
'''
build = '''
cd "$S"
make NETNS_RUN_DIR=/run/netns
'''
package = '''
cd "$S"
make SBINDIR=/usr/sbin DESTDIR="$DESTDIR" install
'''
