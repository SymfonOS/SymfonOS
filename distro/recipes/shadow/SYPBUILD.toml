# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "shadow"
version = "4.18.0-2"
summary = "Benutzer- und Gruppenverwaltung"
license = "BSD-3-Clause"
url = "https://github.com/shadow-maint/shadow/releases/download/4.18.0/"
depends = ["glibc", "acl", "attr", "libxcrypt", "linux-pam", "libselinux", "audit"]
backup = ["etc/login.defs", "etc/default/useradd"]

[[source]]
url = "https://github.com/shadow-maint/shadow/releases/download/4.18.0/shadow-4.18.0.tar.xz"
sha256 = "add4604d3bc410344433122a819ee4154b79dd8316a56298c60417e637c07608"

[build]
prepare = '''
cd "$S"
sed -i 's/groups$(EXEEXT) //' src/Makefile.in
find man -name Makefile.in -exec sed -i 's/groups\.1 / /' {} \;
find man -name Makefile.in -exec sed -i 's/getspnam\.3 / /' {} \;
find man -name Makefile.in -exec sed -i 's/passwd\.5 / /' {} \;
sed -e 's:#ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:' -e 's:/var/spool/mail:/var/mail:' \
    -e 's:^#\?HOME_MODE.*:HOME_MODE\t0700:' -e 's:^UMASK.*:UMASK\t\t022:' \
    -e '/PATH=/{s@/sbin:@@;s@/bin:@@}' -i etc/login.defs
'''
build = '''
cd "$S"
./configure --sysconfdir=/etc --disable-static --with-{b,yes}crypt --without-libbsd --with-group-name-max-length=32 --with-libpam --with-selinux --with-audit
make
'''
package = '''
cd "$S"
make DESTDIR="$DESTDIR" exec_prefix=/usr install
make -C man DESTDIR="$DESTDIR" install-man
install -d "$DESTDIR/etc/default"
printf 'GROUP=999\nHOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=no\n' > "$DESTDIR/etc/default/useradd"
# PAM-Konfiguration liefert symfonos-security (wie bei Fedora nur ein Paket für /etc/pam.d)
rm -rf "$DESTDIR/etc/pam.d"
'''
