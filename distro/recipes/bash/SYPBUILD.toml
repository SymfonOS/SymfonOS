# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "bash"
version = "5.3-1"
summary = "Bourne Again Shell"
license = "GPL-3.0-or-later"
url = "https://ftp.gnu.org/gnu/bash/"
depends = ["glibc", "readline", "ncurses"]
provides = ["sh"]
backup = ["etc/bash.bashrc"]

[[source]]
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"
sha256 = "TODO"

[build]
style = "autotools"
configure_flags = "--without-bash-malloc --with-installed-readline bash_cv_strtold_broken=no --docdir=/usr/share/doc/bash-5.3"
post_install = '''
ln -sf bash "$DESTDIR/usr/bin/sh"
install -d "$DESTDIR/etc"
cat > "$DESTDIR/etc/bash.bashrc" <<'EOF'
# symfonOS – systemweite Bash-Einstellungen
[[ $- != *i* ]] && return
PS1='\[\e[38;2;124;92;255m\]\u@\h\[\e[0m\] \w \$ '
alias ls='ls --color=auto'
alias grep='grep --color=auto'
EOF
'''
