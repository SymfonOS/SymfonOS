sha256 = "7705b0db059c53a21d6a77c0b50f6c467d91a0ea92ff875f1c93527cd2762395"

[build]
build = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib
'''
package = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib DESTDIR="$DESTDIR" install
'''
