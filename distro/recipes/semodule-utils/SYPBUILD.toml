[package]
name = "semodule-utils"
version = "3.8.1-1"
summary = "SELinux-Modulwerkzeuge (semodule_package, semodule_link, semodule_expand)"
license = "GPL-2.0-only"
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/"
depends = ["glibc", "libsepol"]

[[source]]
