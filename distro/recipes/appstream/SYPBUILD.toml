# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
# GENERATED von tools/desktop-recipes.py – Änderungen dort vornehmen
[package]
name = "appstream"
version = "1.1.0-2"
summary = "Programmkatalog-Metadaten (AppStream, mit Qt-Anbindung)"
license = "LGPL-2.1-or-later"
url = "https://www.freedesktop.org/software/appstream/releases/"
depends = ["glib2", "curl", "libxml2", "libfyaml", "libxmlb", "zstd", "systemd", "qt6-base"]
makedepends = ["meson", "gperf", "gettext"]

[[source]]
url = "https://www.freedesktop.org/software/appstream/releases/AppStream-1.1.0.tar.xz"
sha256 = "298b4732a2670503328e022d68d6ebbb253c716dad0b6ba127a4065262dd2f2c"

[build]
style = "meson"
configure_flags = "-Dstemming=false -Dsystemd=true -Dvapi=false -Dqt=true -Dqt-versions=6 -Dcompose=false -Dgir=false -Dsvg-support=false -Dzstd-support=true -Ddocs=false -Dapidocs=false -Dinstall-docs=false"
pre_configure = '''
python3 - <<'PY'
import re
p = "data/meson.build"
s = open(p).read()
s, n = re.subn(r"metainfo_i18n = i18n\.itstool_join\(.*?\n\)\n",
               "metainfo_i18n = custom_target('metainfo-copy', input: metainfo_with_relinfo, "
               "output: 'org.freedesktop.appstream.cli.metainfo.xml', command: ['cp', '@INPUT@', '@OUTPUT@'], "
               "install: true, install_dir: metainfo_dir)\n", s, flags=re.S)
assert n == 1, "itstool_join nicht gefunden"
open(p, "w").write(s)
PY
'''
