# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "syp"
version = "1.0.0-22"
summary = "symfonOS-Paketmanager syp und Paket-Konverter syp-convert"
license = "GPL-3.0-or-later"
depends = ["glibc", "libarchive", "zstd", "libsodium", "sqlite", "curl", "bash"]
makedepends = ["pkgconf", "make", "gcc"]
backup = ["etc/syp/syp.toml"]

[[source]]
path = "@/csrc"

[[source]]
path = "@/system"

[build]
build = '''
make -C "$SRCDIR/csrc" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
'''
package = '''
make -C "$SRCDIR/csrc" DESTDIR="$DESTDIR" install
install -Dm644 "$SRCDIR/system/etc/syp/syp.toml" "$DESTDIR/etc/syp/syp.toml"
install -d "$DESTDIR/var/lib/syp" "$DESTDIR/var/cache/syp/pkg" "$DESTDIR/etc/syp/keys"
# täglicher Paketlisten-Abgleich (sonst sieht die Update-Benachrichtigung nie neue Versionen); per Preset an
install -Dm644 -t "$DESTDIR/usr/lib/systemd/system" "$SRCDIR/system/usr/lib/systemd/system/syp-sync.service" \
  "$SRCDIR/system/usr/lib/systemd/system/syp-sync.timer"
printf 'enable syp-sync.timer\n' | install -Dm644 /dev/stdin "$DESTDIR/usr/lib/systemd/system-preset/60-syp.preset"
'''
