# GENERATED von tools/desktop-recipes.py – Änderungen dort vornehmen
[package]
name = "inter-font"
version = "4.1-1"
arch = "any"
summary = "Schrift Inter (Oberfläche)"
license = "OFL-1.1"
url = "https://github.com/rsms/inter/releases/download/v4.1/"
depends = ["fontconfig"]

[[source]]
url = "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip"
sha256 = "9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e"

[build]
build = ":"
package = '''
cd "$SRCDIR"
find . -type f \( -name '*.ttf' -o -name '*.ttc' -o -name '*.otf' \) -not -path '*/web/*' -not -path '*/extras/*' -print0 |
  while IFS= read -r -d '' f; do install -Dm644 "$f" "$DESTDIR/usr/share/fonts/inter/$(basename "$f")"; done
'''
