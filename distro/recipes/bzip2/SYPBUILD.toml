# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "bzip2"
version = "1.0.8-1"
summary = "Blocksortierende Kompression"
license = "bzip2-1.0.6"
url = "https://www.sourceware.org/pub/bzip2/"
depends = ["glibc"]
provides = ["so:libbz2.so.1.0"]

[[source]]
url = "https://www.sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "TODO"

[[source]]
url = "https://www.linuxfromscratch.org/patches/lfs/12.4/bzip2-1.0.8-install_docs-1.patch"
sha256 = "TODO"
extract = false

[build]
dir = "bzip2-1.0.8"
prepare = '''
cd "$S"; patch -Np1 -i ../bzip2-1.0.8-install_docs-1.patch
sed -i 's@\(ln -s -f \)$(PREFIX)/bin/@\1@' Makefile
sed -i "s@(PREFIX)/man@(PREFIX)/share/man@g" Makefile
'''
build = '''
cd "$S"
make -f Makefile-libbz2_so CFLAGS="$CFLAGS -fPIC"
make clean
make CFLAGS="$CFLAGS"
'''
package = '''
cd "$S"
make PREFIX="$DESTDIR/usr" install
cp -a libbz2.so.* "$DESTDIR/usr/lib"
ln -sf libbz2.so.1.0.8 "$DESTDIR/usr/lib/libbz2.so"
cp bzip2-shared "$DESTDIR/usr/bin/bzip2"
for i in bzcat bunzip2; do ln -sf bzip2 "$DESTDIR/usr/bin/$i"; done
rm -f "$DESTDIR/usr/lib/libbz2.a"
'''
