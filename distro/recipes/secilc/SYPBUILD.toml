[package]
name = "secilc"
version = "3.8.1-1"
summary = "CIL-Compiler für SELinux"
license = "BSD-2-Clause"
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/"
depends = ["glibc", "libsepol"]

[[source]]
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/secilc-3.8.1.tar.gz"
sha256 = "TODO"

[build]
build = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib
'''
package = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib DESTDIR="$DESTDIR" install
'''
