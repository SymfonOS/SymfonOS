# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "secilc"
version = "3.8.1-1"
summary = "CIL-Compiler für SELinux"
license = "BSD-2-Clause"
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/"
depends = ["glibc", "libsepol"]

[[source]]
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/secilc-3.8.1.tar.gz"
sha256 = "3db2974dd9a3c8403ada0392deff267b0398a74b4e7a0b051af76457270848d1"

[build]
build = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib secilc secil2conf secil2tree
'''
package = '''
cd "$S"
for b in secilc secil2conf secil2tree; do install -Dm755 "$b" "$DESTDIR/usr/bin/$b"; done
'''
