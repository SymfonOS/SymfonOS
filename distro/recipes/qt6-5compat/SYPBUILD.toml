[package]
name = "qt6-5compat"
version = "6.9.2-1"
summary = "Qt 6 Qt5-Kompatibilitätsmodule"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base", "qt6-declarative", "icu"]
makedepends = ["cmake", "ninja", "pkgconf", "qt6-shadertools"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qt5compat-everywhere-src-6.9.2.tar.xz"
sha256 = "cb289905c689fc271ce783f8b67844040aa73d78f4f0cf8421fa713390a75b60"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
