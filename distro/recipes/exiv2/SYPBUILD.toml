[package]
name = "exiv2"
version = "0.28.5-1"
summary = "Bild-Metadaten (Exif, IPTC, XMP)"
license = "GPL-2.0-or-later"
url = "https://github.com/Exiv2/exiv2/archive/v0.28.5/"
depends = ["expat", "zlib", "brotli", "curl", "inih"]
makedepends = ["cmake"]

[[source]]
url = "https://github.com/Exiv2/exiv2/archive/v0.28.5/exiv2-0.28.5.tar.gz"
sha256 = "e1671f744e379a87ba0c984617406fdf8c0ad0c594e5122f525b2fb7c28d394d"

[build]
style = "cmake"
configure_flags = "-DEXIV2_ENABLE_VIDEO=yes -DEXIV2_ENABLE_WEBREADY=yes -DEXIV2_ENABLE_CURL=yes -DEXIV2_BUILD_SAMPLES=no -DEXIV2_BUILD_UNIT_TESTS=no -DCMAKE_SKIP_INSTALL_RPATH=ON"
