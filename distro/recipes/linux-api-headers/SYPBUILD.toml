# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "linux-api-headers"
version = "6.16.1-1"
summary = "Kernel-Header für die C-Bibliothek"
license = "GPL-2.0-only"
url = "https://www.kernel.org/pub/linux/kernel/v6.x/"
makedepends = ["filesystem"]

[[source]]
url = "https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.16.1.tar.xz"
sha256 = "TODO"

[build]
build = '''
cd "$S"
make mrproper
make headers
find usr/include -type f ! -name '*.h' -delete
'''
package = '''
cd "$S"
install -d "$DESTDIR/usr"
cp -r usr/include "$DESTDIR/usr"
'''

[options]
strip = false
