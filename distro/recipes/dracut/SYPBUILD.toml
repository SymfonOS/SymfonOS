# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "dracut"
version = "107-2"
summary = "Initramfs-Generator (inkl. Live-Boot)"
license = "GPL-2.0-or-later"
url = "https://github.com/dracut-ng/dracut-ng/archive/refs/tags/"
depends = ["bash", "coreutils", "util-linux", "kmod", "systemd", "cpio", "findutils", "gzip", "zstd"]
backup = ["etc/dracut.conf"]
[[source]]
url = "https://github.com/dracut-ng/dracut-ng/archive/refs/tags/107.tar.gz"
sha256 = "fab19fb41d86de681c022d1a8798804595750be934d98a785ff0257dcdfc9a78"
filename = "dracut-ng-107.tar.gz"
[build]
build = '''
cd "$S"
./configure --prefix=/usr --sysconfdir=/etc --libdir=/usr/lib --systemdsystemunitdir=/usr/lib/systemd/system --disable-documentation
make
'''
package = '''
cd "$S"
make DESTDIR="$DESTDIR" install
install -Dm644 /dev/stdin "$DESTDIR/etc/dracut.conf.d/symfonos.conf" <<'EOF'
hostonly="yes"
# root=/rootflags=/rd.luks.* nur von der Kernel-Befehlszeile: sonst landet subvolid=<id> von @ in der initramfs,
# und nach »syp rollback --system« (neues @ mit anderer id) startet das System nicht mehr
hostonly_cmdline="no"
compress="zstd"
add_dracutmodules+=" btrfs crypt lvm "
EOF
'''
