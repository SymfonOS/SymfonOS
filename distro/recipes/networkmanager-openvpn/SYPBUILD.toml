url = "https://download.gnome.org/sources/NetworkManager-openvpn/1.12/"
depends = ["networkmanager", "openvpn", "glib2"]
makedepends = ["gettext", "libxml2"]

[[source]]
url = "https://download.gnome.org/sources/NetworkManager-openvpn/1.12/NetworkManager-openvpn-1.12.0.tar.xz"
sha256 = "TODO"

[build]
style = "autotools"
configure_flags = "--disable-static --without-gnome --without-gtk4"
post_install = '''
install -Dm644 /dev/stdin "$DESTDIR/usr/lib/sysusers.d/nm-openvpn.conf" <<'SYS'
u nm-openvpn - "NetworkManager OpenVPN" /var/lib/openvpn
SYS
'''
