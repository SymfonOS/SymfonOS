[package]
name = "qt6-translations"
version = "6.9.2-1"
summary = "Qt 6 Übersetzungen"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base"]
makedepends = ["cmake", "ninja", "pkgconf", "qt6-tools"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qttranslations-everywhere-src-6.9.2.tar.xz"
sha256 = "c73bb6281ed365c0f954f4b1b6e1b13e1b3fefd94854f46fcd9a412f641f7ed6"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do [ -z "$l" ] || ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
