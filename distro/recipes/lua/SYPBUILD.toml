[package]
name = "lua"
version = "5.4.8-1"
summary = "Lua-Skriptsprache"
license = "MIT"
url = "https://www.lua.org/ftp/"
depends = ["readline"]

[[source]]
url = "https://www.lua.org/ftp/lua-5.4.8.tar.gz"
sha256 = "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"

[[source]]
url = "https://www.linuxfromscratch.org/patches/blfs/12.4/lua-5.4.8-shared_library-1.patch"
sha256 = "44324a802822f0a35d095aaad2f5f58fa7b1821ae87ae44dbcfc8a23fcd2e67e"
extract = false

[build]
dir = "lua-5.4.8"
prepare = '''
cd "$S"
patch -Np1 -i ../lua-5.4.8-shared_library-1.patch
'''
build = '''
cd "$S"
make linux MYCFLAGS="$CFLAGS" MYLDFLAGS="$LDFLAGS"
'''
package = '''
cd "$S"
make INSTALL_TOP="$DESTDIR/usr" INSTALL_DATA="cp -d" INSTALL_MAN="$DESTDIR/usr/share/man/man1" TO_LIB="liblua.so liblua.so.5.4 liblua.so.5.4.8" install
install -Dm644 /dev/stdin "$DESTDIR/usr/lib/pkgconfig/lua.pc" <<'LUAPC'
V=5.4
R=5.4.8
prefix=/usr
INSTALL_BIN=${prefix}/bin
INSTALL_INC=${prefix}/include
INSTALL_LIB=${prefix}/lib
INSTALL_MAN=${prefix}/share/man/man1
INSTALL_LMOD=${prefix}/share/lua/${V}
INSTALL_CMOD=${prefix}/lib/lua/${V}
exec_prefix=${prefix}
libdir=${exec_prefix}/lib
includedir=${prefix}/include

Name: Lua
Description: An Extensible Extension Language
Version: ${R}
Requires:
Libs: -L${libdir} -llua -lm -ldl
Cflags: -I${includedir}
LUAPC
ln -s lua.pc "$DESTDIR/usr/lib/pkgconfig/lua5.4.pc"
'''
