# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "readline"
version = "8.3-2"
summary = "Zeileneditor-Bibliothek"
license = "GPL-3.0-or-later"
url = "https://ftp.gnu.org/gnu/readline/"
depends = ["glibc", "ncurses"]
# readline.pc verweist per Requires.private auf ncursesw; ohne pkg-config beim Bau stünde dort "termcap"
makedepends = ["pkgconf"]
provides = ["so:libreadline.so.8"]

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
prepare = '''
cd "$S"
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf
'''
build = '''
cd "$S"
./configure --prefix=/usr --disable-static --with-curses --docdir=/usr/share/doc/readline-8.3
make SHLIB_LIBS="-lncursesw"
'''
package = '''
cd "$S"
make SHLIB_LIBS="-lncursesw" DESTDIR="$DESTDIR" install
if grep -q '^Requires.private:.*termcap' "$DESTDIR/usr/lib/pkgconfig/readline.pc"; then
  echo "readline.pc verweist auf termcap statt ncursesw" >&2; exit 1
fi
'''
