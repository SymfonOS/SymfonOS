depends = ["glibc", "gcc", "vulkan-loader", "lcms2", "glslang", "spirv-tools"]
makedepends = ["meson", "python", "python-jinja", "vulkan-headers"]

[[source]]
url = "https://github.com/haasn/libplacebo/archive/v7.351.0/libplacebo-7.351.0.tar.gz"
