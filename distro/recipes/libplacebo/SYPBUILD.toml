sha256 = "44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc"

[build]
dir = "libplacebo-7.351.0"
style = "meson"
configure_flags = "-Dvulkan=enabled -Dopengl=enabled -Dvulkan-registry=/usr/share/vulkan/registry/vk.xml -Dlcms=enabled -Ddemos=false -Dtests=false -Dlibdovi=disabled -Dd3d11=disabled"
pre_configure = '''
rm -rf 3rdparty/fast_float 3rdparty/glad
ln -s "$SRCDIR/fast_float-8.0.2" 3rdparty/fast_float
