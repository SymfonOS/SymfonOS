[package]
name = "libplacebo"
version = "7.351.0-1"
summary = "GPU-Bildverarbeitung für Videos (Renderer von mpv)"
license = "LGPL-2.1-or-later"
url = "https://github.com/haasn/libplacebo/archive/v7.351.0/"
depends = ["glibc", "gcc", "vulkan-loader", "lcms2", "glslang", "spirv-tools"]
makedepends = ["meson", "python", "python-jinja", "vulkan-headers"]

[[source]]
url = "https://github.com/haasn/libplacebo/archive/v7.351.0/libplacebo-7.351.0.tar.gz"
sha256 = "TODO"

[[source]]
url = "https://github.com/fastfloat/fast_float/archive/v8.0.2/fast_float-8.0.2.tar.gz"
sha256 = "TODO"

[[source]]
url = "https://github.com/Dav1dde/glad/archive/v2.0.8/glad-2.0.8.tar.gz"
sha256 = "TODO"

[build]
dir = "libplacebo-7.351.0"
style = "meson"
configure_flags = "-Dvulkan=enabled -Dopengl=enabled -Dvulkan-registry=/usr/share/vulkan/registry/vk.xml -Dlcms=enabled -Ddemos=false -Dtests=false -Dlibdovi=disabled -Dd3d11=disabled"
pre_configure = '''
rm -rf 3rdparty/fast_float 3rdparty/glad
ln -s "$SRCDIR/fast_float-8.0.2" 3rdparty/fast_float
ln -s "$SRCDIR/glad-2.0.8" 3rdparty/glad
'''
