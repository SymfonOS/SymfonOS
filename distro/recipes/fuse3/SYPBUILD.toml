[package]
name = "fuse3"
version = "3.17.4-1"
summary = "Dateisysteme im Benutzerraum (FUSE 3)"
license = "GPL-2.0-only AND LGPL-2.1-only"
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.17.4/"
depends = ["glibc"]
makedepends = ["meson"]

[[source]]
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.17.4/fuse-3.17.4.tar.gz"
sha256 = "df9e40ae927b73dc702d0bce7925c0c618af47ad0b13204fbf2be66e54d8528b"

[build]
style = "meson"
configure_flags = "-Dexamples=false"
pre_configure = "sed -i '/^udev/,$ s/^/#/' util/meson.build"
post_install = '''
chmod u+s "$DESTDIR/usr/bin/fusermount3"
'''

[options]
hardening_reason = "fusermount3 ist setuid (wie bei Fedora)"
