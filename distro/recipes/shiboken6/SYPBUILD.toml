# GENERATED von tools/desktop-recipes.py – Änderungen dort vornehmen
[package]
name = "shiboken6"
version = "6.9.2-2"
summary = "Anbindungs-Generator und Laufzeit für Qt für Python"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.9.2-src/"
depends = ["python", "qt6-base", "llvm", "libxml2", "libxslt"]
makedepends = ["cmake", "ninja"]

[[source]]
url = "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.9.2-src/pyside-setup-everywhere-src-6.9.2.tar.xz"
sha256 = "9ec087465342bdc9dbe492a30e58fdbbc5448655deacf5982a0fe7123f59222d"

[build]
dir = "pyside-setup-everywhere-src-6.9.2/sources/shiboken6"
style = "cmake"
configure_flags = "-DFORCE_LIMITED_API=no -DBUILD_TESTS=OFF -DCMAKE_SKIP_RPATH=ON -Wno-dev"
pre_configure = '''
python3 - libshiboken/embed/embedding_generator.py <<'PY'
import sys
p = sys.argv[1]
s = open(p).read()
old = "    runpy(f'-m zipfile -c {zip_name} {files}')\n"
new = (
    "    import zipfile as _zf\n"
    "    with _zf.ZipFile(zip_name, 'w') as _z:\n"
    "        for _r, _d, _fs in sorted(os.walk('.')):\n"
    "            _d.sort()\n"
    "            for _f in sorted(_fs):\n"
    "                _p = os.path.normpath(os.path.join(_r, _f))\n"
    "                if _p == zip_name:\n"
    "                    continue\n"
    "                _i = _zf.ZipInfo(_p, (1980, 1, 1, 0, 0, 0))\n"
    "                _i.external_attr = 0o644 << 16\n"
    "                _z.writestr(_i, open(_p, 'rb').read())\n"
)
assert old in s, 'zipfile-Aufruf nicht gefunden'
open(p, 'w').write(s.replace(old, new))
PY
'''
