# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "ca-certificates"
version = "2025.08.12-1"
summary = "Vertrauenswürdige Zertifizierungsstellen (Mozilla)"
license = "MPL-2.0"
url = "https://curl.se/ca/"

[[source]]
url = "https://curl.se/ca/cacert-2025-08-12.pem"
sha256 = "TODO"
filename = "cacert-2025-08-12.pem"
extract = false

[build]
package = '''
install -Dm644 "$SRCDIR/cacert-2025-08-12.pem" "$DESTDIR/etc/ssl/certs/ca-certificates.crt"
ln -sf certs/ca-certificates.crt "$DESTDIR/etc/ssl/cert.pem"
'''
