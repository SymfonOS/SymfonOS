# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "binutils"
version = "2.45-1"
summary = "Assembler, Linker und Binärwerkzeuge"
license = "GPL-3.0-or-later"
url = "https://sourceware.org/pub/binutils/releases/"
depends = ["glibc", "zlib", "zstd"]
makedepends = ["flex", "pkgconf", "file"]

[[source]]
url = "https://sourceware.org/pub/binutils/releases/binutils-2.45.tar.xz"
sha256 = "TODO"

[build]
build = '''
cd "$S"; mkdir -p build; cd build
../configure --prefix=/usr --sysconfdir=/etc --enable-ld=default --enable-plugins --enable-shared \
  --disable-werror --enable-64-bit-bfd --enable-new-dtags --with-system-zlib --enable-default-hash-style=gnu
make tooldir=/usr
'''
package = '''
cd "$S/build"
make DESTDIR="$DESTDIR" tooldir=/usr install
rm -f "$DESTDIR"/usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a
'''
