# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "tpm2-tss"
version = "4.1.3-1"
summary = "TPM-2.0-Software-Stack (TPM-gebundene Verschlüsselung)"
license = "BSD-2-Clause"
url = "https://github.com/tpm2-software/tpm2-tss/releases/download/4.1.3/"
depends = ["glibc", "openssl", "json-c", "curl", "util-linux"]
provides = ["so:libtss2-esys.so.0"]

[[source]]
url = "https://github.com/tpm2-software/tpm2-tss/releases/download/4.1.3/tpm2-tss-4.1.3.tar.gz"
sha256 = "37f1580200ab78305d1fc872d89241aaee0c93cbe85bc559bf332737a60d3be8"

[build]
style = "autotools"
configure_flags = "--with-runstatedir=/run --with-sysusersdir=/usr/lib/sysusers.d --with-tmpfilesdir=/usr/lib/tmpfiles.d --with-udevrulesdir=/usr/lib/udev/rules.d --disable-doxygen-doc --disable-fapi --disable-policy"
