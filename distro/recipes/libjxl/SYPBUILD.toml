# GENERATED von tools/desktop-recipes.py – Änderungen dort vornehmen
[package]
name = "libjxl"
version = "0.11.1-1"
summary = "JPEG-XL-Bilder"
license = "BSD-3-Clause"
url = "https://github.com/libjxl/libjxl/archive/v0.11.1/"
depends = ["highway", "brotli", "lcms2", "libpng", "libjpeg-turbo", "giflib", "libwebp"]
makedepends = ["cmake", "ninja", "python"]

[[source]]
url = "https://github.com/libjxl/libjxl/archive/v0.11.1/libjxl-0.11.1.tar.gz"
sha256 = "1492dfef8dd6c3036446ac3b340005d92ab92f7d48ee3271b5dac1d36945d3d9"

[build]
style = "cmake"
configure_flags = "-DJPEGXL_ENABLE_TOOLS=ON -DJPEGXL_ENABLE_PLUGINS=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_SKCMS=OFF -DJPEGXL_FORCE_SYSTEM_BROTLI=ON -DJPEGXL_FORCE_SYSTEM_HWY=ON -DJPEGXL_FORCE_SYSTEM_LCMS2=ON -DJPEGXL_ENABLE_JPEGLI=OFF -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_DOXYGEN=OFF"
