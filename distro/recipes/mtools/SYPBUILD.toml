# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "mtools"
version = "4.0.49-2"
summary = "FAT-Images ohne Mount (EFI-Boot-Image)"
license = "GPL-3.0-or-later"
url = "https://ftp.gnu.org/gnu/mtools/"
depends = ["glibc"]
backup = ["etc/mtools.conf"]

[[source]]
url = "https://ftp.gnu.org/gnu/mtools/mtools-4.0.49.tar.bz2"
sha256 = "6fe5193583d6e7c59da75e63d7234f76c0b07caf33b103894f46f66a871ffc9f"

[build]
style = "autotools"
configure_flags = "--sysconfdir=/etc"
post_install = '''
# Die Beispieldatei enthält die Zeile "SAMPLE FILE", an der mtools selbst scheitert (wie Arch: auskommentieren)
sed -i '/^SAMPLE FILE$/s:^:# :' mtools.conf
install -Dm644 mtools.conf "$DESTDIR/etc/mtools.conf"
'''
