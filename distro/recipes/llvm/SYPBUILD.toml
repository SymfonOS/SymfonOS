[package]
name = "llvm"
version = "20.1.8-1"
summary = "LLVM-Compiler-Infrastruktur und Clang"
license = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/"
depends = ["glibc", "gcc", "libffi", "zlib", "zstd", "libxml2", "ncurses"]
makedepends = ["cmake", "ninja", "python"]
provides = ["so:libLLVM.so.20.1", "clang"]

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-20.1.8.src.tar.xz"
sha256 = "e1363888216b455184dbb8a74a347bf5612f56a3f982369e1cba6c7e0726cde1"

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/cmake-20.1.8.src.tar.xz"
sha256 = "3319203cfd1172bbac50f06fa68e318af84dcb5d65353310c0586354069d6634"

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/third-party-20.1.8.src.tar.xz"
sha256 = "9a4e452a8163732d417db067a89190fcda823cb3aa33199e834ac7c028923f4b"

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang-20.1.8.src.tar.xz"
sha256 = "b7a1b7b0af7b9c7596af6bd46e36d11321926eaa66a7a7dc957ab0a1375ee4b0"

[build]
dir = "llvm-20.1.8.src"
style = "cmake"
configure_flags = "-DCMAKE_SKIP_INSTALL_RPATH=ON -DLLVM_ENABLE_FFI=ON -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_ENABLE_RTTI=ON -DLLVM_TARGETS_TO_BUILD='host;AMDGPU' -DLLVM_BINUTILS_INCDIR=/usr/include -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_ENABLE_ZSTD=ON -DLLVM_PARALLEL_LINK_JOBS=2 -DCLANG_DEFAULT_PIE_ON_LINUX=ON -DCLANG_CONFIG_FILE_SYSTEM_DIR=/etc/clang -DLLVM_INSTALL_UTILS=ON -Wno-dev"
pre_configure = '''
mv ../cmake-20.1.8.src ../cmake
mv ../third-party-20.1.8.src ../third-party
mv ../clang-20.1.8.src tools/clang
grep -rl '#!.*python' | xargs sed -i '1s/python$/python3/'
sed 's/utility/tool/' -i utils/FileCheck/CMakeLists.txt
'''

[options]
env = ["CC=gcc", "CXX=g++"]
