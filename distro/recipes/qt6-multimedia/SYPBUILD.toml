[package]
name = "qt6-multimedia"
version = "6.9.2-1"
summary = "Qt 6 Multimedia (FFmpeg-Backend)"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base", "qt6-declarative", "qt6-shadertools", "ffmpeg", "pulseaudio", "alsa-lib", "libva"]
makedepends = ["cmake", "ninja", "pkgconf"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qtmultimedia-everywhere-src-6.9.2.tar.xz"
sha256 = "7bf8a19a57a7432181b05d0e264acfd8ca4b75a3901d01a27a32935703e5ab12"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF -DFEATURE_gstreamer=OFF -DFEATURE_ffmpeg=ON -DFEATURE_pulseaudio=ON"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
