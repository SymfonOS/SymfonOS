[package]
name = "qt6-shadertools"
version = "6.9.2-1"
summary = "Qt 6 Shader-Werkzeuge"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/"
depends = ["qt6-base"]
makedepends = ["cmake", "ninja", "pkgconf"]

[[source]]
url = "https://download.qt.io/archive/qt/6.9/6.9.2/submodules/qtshadertools-everywhere-src-6.9.2.tar.xz"
sha256 = "17678af9d9543224bbb932bf18d4fc05e180b2b3a3216241e557631bd6bf1495"

[build]
style = "cmake"
configure_flags = "-DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF"
post_install = '''
cd "$DESTDIR"
install -d usr/bin
[ -f "$S/_build/user_facing_tool_links.txt" ] && while read -r l; do [ -z "$l" ] || ln -sf $l; done < "$S/_build/user_facing_tool_links.txt"
true
'''
