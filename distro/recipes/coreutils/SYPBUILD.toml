# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "coreutils"
version = "9.7-1"
summary = "GNU-Grundwerkzeuge"
license = "GPL-3.0-or-later"
url = "https://ftp.gnu.org/gnu/coreutils/"
depends = ["glibc", "acl", "attr", "libcap", "openssl", "gmp"]
[[source]]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.7.tar.xz"
sha256 = "e8bb26ad0293f9b5a1fc43fb42ba970e312c66ce92c1b0b16713d7500db251bf"
[build]
build = '''
cd "$S"
FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --enable-no-install-program=kill,uptime
make
'''
package = '''
cd "$S"
make DESTDIR="$DESTDIR" install
install -d "$DESTDIR/usr/sbin" "$DESTDIR/usr/share/man/man8"
mv "$DESTDIR/usr/bin/chroot" "$DESTDIR/usr/sbin"
mv "$DESTDIR/usr/share/man/man1/chroot.1" "$DESTDIR/usr/share/man/man8/chroot.8"
sed -i 's/"1"/"8"/' "$DESTDIR/usr/share/man/man8/chroot.8"
'''
