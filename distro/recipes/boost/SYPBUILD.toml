[package]
name = "boost"
version = "1.89.0-1"
summary = "C++-Bibliotheken (Boost)"
license = "BSL-1.0"
url = "https://github.com/boostorg/boost/releases/download/boost-1.89.0/"
depends = ["glibc", "gcc", "bzip2", "zlib", "xz", "zstd", "icu"]
makedepends = ["which", "python"]

[[source]]
url = "https://github.com/boostorg/boost/releases/download/boost-1.89.0/boost-1.89.0-b2-nodocs.tar.xz"
sha256 = "875cc413afa6b86922b6df3b2ad23dec4511c8a741753e57c1129e7fa753d700"

[build]
build = '''
cd "$S"
./bootstrap.sh --prefix=/usr --with-python=python3
./b2 stage -j"$NPROC" threading=multi link=shared variant=release debug-symbols=off
'''
package = '''
cd "$S"
./b2 install --prefix="$DESTDIR/usr" threading=multi link=shared variant=release debug-symbols=off
'''
