# symfonOS-Rezept – Format: siehe docs/PAKETFORMAT.md
[package]
name = "libsemanage"
version = "3.8.1-1"
summary = "SELinux-Richtlinienverwaltung"
license = "LGPL-2.1-or-later"
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/"
depends = ["glibc", "libselinux", "libsepol", "bzip2", "audit"]
makedepends = ["flex", "bison"]
provides = ["so:libsemanage.so.2"]
backup = ["etc/selinux/semanage.conf"]

[[source]]
url = "https://github.com/SELinuxProject/selinux/releases/download/3.8.1/libsemanage-3.8.1.tar.gz"
sha256 = "7b39127b219cc70bfd935a4af6b0f2ba83d4b35c916f253c7e942c23ab490f07"

[build]
build = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib
'''
package = '''
cd "$S"
make PREFIX=/usr SBINDIR=/usr/sbin LIBDIR=/usr/lib SHLIBDIR=/usr/lib DESTDIR="$DESTDIR" install
rm -f "$DESTDIR/usr/lib/libsemanage.a"
'''
