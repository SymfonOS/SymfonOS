[package]
name = "ghostscript"
version = "10.05.1-2"
summary = "PostScript- und PDF-Interpreter (Rasterung für Drucker)"
license = "AGPL-3.0-or-later"
url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10051/"
depends = ["fontconfig", "freetype", "libjpeg-turbo", "libpng", "libtiff", "zlib", "cups", "dejavu-fonts"]

[[source]]
url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10051/ghostscript-10.05.1.tar.xz"
sha256 = "22f2bdca15c28830c9715cddc5c296ea66898bfdab0b604a4e0bcfeb03af6cad"

[build]
build = '''
cd "$S"
rm -rf freetype jpeg libpng zlib tiff
# GCC 15 übersetzt standardmäßig als C23; stdpre.h definiert bool noch selbst
export CFLAGS="$CFLAGS -std=gnu17"
./configure --prefix=/usr --disable-compile-inits --with-system-libtiff --without-x --disable-gtk --without-tesseract \
  --without-libpaper --without-ijs
make
make so
'''
package = '''
cd "$S"
make DESTDIR="$DESTDIR" install
make DESTDIR="$DESTDIR" soinstall
install -d "$DESTDIR/usr/include/ghostscript"
install -m644 base/*.h "$DESTDIR/usr/include/ghostscript"
ln -sfn ghostscript "$DESTDIR/usr/include/ps"
'''
