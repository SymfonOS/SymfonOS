UI menu.c32
MENU TITLE symfonOS
PROMPT 0
TIMEOUT 50
DEFAULT symfonos

LABEL symfonos
  MENU LABEL symfonOS Live (%ARCH%, BIOS)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

LABEL symfonos-a11y
  MENU LABEL symfonOS Live mit Bildschirmleser (BIOS)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% symfonos.a11y=1

LABEL symfonos-safe
  MENU LABEL symfonOS Live - sichere Grafik (BIOS)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

LABEL memtest
  MENU LABEL Arbeitsspeicher testen (memtest86+)
  LINUX /boot/memtest86+/memtest
