# Nur für den ISO-Bau. Auf dem installierten System verwaltet syp alle Pakete.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Eigene Pakete (symfonos-tools, symfonos-branding, calamares, AUR-Abhängigkeiten).
# Wird von build.sh vorher mit makepkg + repo-add erzeugt.
[symfonos-local]
SigLevel = Optional TrustAll
Server = file:///tmp/symfonos-localrepo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
