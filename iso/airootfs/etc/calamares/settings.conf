---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: symfonos
    module: shellprocess
    config: shellprocess_symfonos.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@symfonos
      - initcpiocfg
      - initcpio
      - services-systemd
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: symfonos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
