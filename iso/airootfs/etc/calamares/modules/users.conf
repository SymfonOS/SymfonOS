---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - wheel
  - audio
  - video
  - lp
  - realtime
  - name: autologin
    must_exist: false
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
  nonempty: true
  minLength: 8
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, exam, liveuser ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "symfonos-${cpu}"
