---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/lib/ollama             # KI-Modelle: groß, nicht in System-Snapshots
    subvolume: /@ollama
  - mountPoint: /var/lib/symfonos-assist
    subvolume: /@ai_models
btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
    ssdOptions: [ discard=async ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
