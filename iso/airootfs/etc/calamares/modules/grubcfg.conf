---
overwrite: false
keepDistributor: false
prefer_grub_d: false
defaults:
  GRUB_TIMEOUT: 3
  GRUB_DISTRIBUTOR: "symfonOS"
  GRUB_DEFAULT: "saved"
  GRUB_SAVEDEFAULT: "true"
  GRUB_DISABLE_SUBMENU: "false"
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_DISABLE_RECOVERY: "true"
  GRUB_DISABLE_OS_PROBER: "false"
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash loglevel=3 lsm=landlock,lockdown,yama,integrity,apparmor,bpf"
always_use_defaults: true
