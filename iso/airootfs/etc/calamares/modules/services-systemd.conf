---
units:
  - { name: "NetworkManager.service", action: "enable", mandatory: true }
  - { name: "bluetooth.service", action: "enable" }
  - { name: "cups.socket", action: "enable" }
  - { name: "avahi-daemon.service", action: "enable" }
  - { name: "ufw.service", action: "enable" }
  - { name: "apparmor.service", action: "enable" }
  - { name: "power-profiles-daemon.service", action: "enable" }
  - { name: "systemd-timesyncd.service", action: "enable" }
  - { name: "fstrim.timer", action: "enable" }
  - { name: "snapper-timeline.timer", action: "enable" }
  - { name: "snapper-cleanup.timer", action: "enable" }
  - { name: "grub-btrfsd.service", action: "enable" }
  - { name: "ollama.service", action: "enable" }
  - { name: "syp-sync.timer", action: "enable" }
  - { name: "symfonos-firstboot.service", action: "enable" }
  - { name: "sshd.service", action: "disable" }
  - { name: "symfonos-live-setup.service", action: "disable" }
