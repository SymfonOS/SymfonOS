---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: none          # zram ist standardmäßig aktiv
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
enableLuksAutomatedPartitioning: true
luksGeneration: luks1            # GRUB kann /boot nur auf LUKS1 bzw. LUKS2+PBKDF2 öffnen
partitionLayout:
  - name: "symfonOS"
    filesystem: "btrfs"
    mountPoint: "/"
    size: 100%
